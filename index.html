<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deliview — Maintenance en cours</title>
  <meta name="description" content="Deliview est en cours de maintenance. Nous serons bientôt de retour.">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image: radial-gradient(circle at 50% 50%, #1a1a1a 0%, #0a0a0a 100%);
    }
    .container { max-width: 520px; text-align: center; }
    .logo {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 48px;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 32px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    h1 {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 16px;
      line-height: 1.6;
      color: #999;
      margin-bottom: 32px;
    }
    .contact {
      padding-top: 32px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 14px;
      color: #666;
    }
    .contact a {
      color: #fff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.3);
    }
    .contact a:hover { border-color: #fff; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">Deliview</div>
    <div class="icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <polyline points="12 6 12 12 16 14"></polyline>
      </svg>
    </div>
    <h1>Maintenance en cours</h1>
    <p>Notre site est temporairement indisponible le temps de finaliser une mise à jour technique. Nous serons de retour très prochainement.</p>
    <div class="contact">
      Pour toute question : <a href="mailto:tom@deliview.fr">tom@deliview.fr</a>
    </div>
  </div>
</body>
</html>
